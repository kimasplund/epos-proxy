version: '3'

services:
  epos-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "443:443"
    volumes:
      - ./config.json:/app/config.json
      - ./cert:/app/cert
      - ./data:/app/data
      - ./log:/app/log
    restart: unless-stopped
    
  watchtower:
    image: containrrr/watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    command: --schedule "0 0 * * *" --cleanup 